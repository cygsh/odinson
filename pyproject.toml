[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odinson"
version = "3.0.0"
description = "Low-cost IoT vibration & seismic monitoring: Arduino MPU6050 -> Python gateway -> local UI + AWS (DynamoDB, Lambda, SNS, CloudWatch, S3, IoT Core)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yogesh, Angel, Tanjil, Sashrika" }]
dependencies = [
    "flask>=3.0,<4",
    "pyserial>=3.5",
    "requests>=2.31,<3",
    "matplotlib>=3.8",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
odinson = "run:main"

[tool.setuptools]
py-modules = ["run"]
packages = ["odinson", "odinson.cloud"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
